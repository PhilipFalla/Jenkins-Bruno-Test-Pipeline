info:
  name: AuthorFilter
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/books?author=HUMBLE"
  params:
    - name: author
      value: HUMBLE
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Técnica ISTQB: Partición de equivalencia. Cubre: ?author= en la partición válida con coincidencia, en mayúsculas (HUMBLE)
        test("devuelve solo el libro cuyo autor contiene la subcadena", function() {
          expect(res.getBody()[0].author).to.equal("Forsgren, Humble, Kim");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.length
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Técnica ISTQB:** Partición de equivalencia

  **Cubre:** ?author= en la partición válida con coincidencia, en mayúsculas (HUMBLE)

  **Resultado esperado:** 200 y un solo libro: Accelerate
