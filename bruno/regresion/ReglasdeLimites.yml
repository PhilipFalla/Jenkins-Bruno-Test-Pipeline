info:
  name: ReglasdeLimites
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/books"
  body:
    type: json
    data: |-
      {
        "title": "Antes de Gutenberg",
        "author": "Anónimo",
        "year": 1449
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: "// Técnica ISTQB: Valores frontera. Cubre: year = 1449, justo debajo del mínimo (1450)"
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  **Técnica ISTQB:** Valores frontera

  **Cubre:** year = 1449, justo debajo del mínimo (1450)

  **Resultado esperado:** 422
