info:
  name: GetBook
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/books/1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"
    - expression: res.body.title
      operator: eq
      value: Grokking Continuous Delivery

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
