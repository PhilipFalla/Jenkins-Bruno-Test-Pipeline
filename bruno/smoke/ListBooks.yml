info:
  name: ListBooks
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/books"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body.length
      operator: eq
      value: "3"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
